name: Build Chrony .deb Packages

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force build a specific version (e.g., 4.8)'
        required: false
        default: ''

env:
  UPSTREAM_URL: https://chrony-project.org/releases

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tarball: ${{ steps.parse.outputs.tarball }}
      should_build: ${{ steps.check.outputs.should_build }}
      tag_name: ${{ steps.parse.outputs.tag_name }}
    steps:
      - name: Determine latest Chrony version
        id: parse
        run: |
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            VERSION="${{ github.event.inputs.force_version }}"
          else
            VERSION=$(curl -sSL "${{ env.UPSTREAM_URL }}/" | \
              grep -oE 'chrony-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.gz' | \
              grep -v '\-pre' | \
              sed 's/chrony-//;s/\.tar\.gz//' | \
              sort -V | tail -n1)
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tarball=chrony-${VERSION}.tar.gz" >> $GITHUB_OUTPUT
          echo "tag_name=chrony-${VERSION}" >> $GITHUB_OUTPUT
          echo "Latest upstream version: ${VERSION}"

      - name: Check against existing GitHub Releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          TAG_NAME="${{ steps.parse.outputs.tag_name }}"

          # Get latest release tag from this repo; empty string if none exist yet
          LATEST_RELEASE_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")

          echo "Latest release tag: ${LATEST_RELEASE_TAG}"
          echo "Target tag: ${TAG_NAME}"

          if [ "$LATEST_RELEASE_TAG" = "$TAG_NAME" ] && [ -z "${{ github.event.inputs.force_version }}" ]; then
            echo "Release ${TAG_NAME} already exists. Skipping."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release ${TAG_NAME} is new or forced. Building."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-deb:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "22.04"
            pkg_suffix: "ubuntu22.04"
          - ubuntu_version: "26.04"
            pkg_suffix: "ubuntu26.04"

    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu_version }}

    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential wget ca-certificates fakeroot dpkg-dev \
            libcap-dev libnss3-dev libedit-dev libseccomp-dev \
            libtomcrypt-dev libtommath-dev nettle-dev pkg-config

      - name: Download Chrony source
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          wget -q "${{ env.UPSTREAM_URL }}/chrony-${VERSION}.tar.gz"
          tar xzf "chrony-${VERSION}.tar.gz"

      - name: Build Chrony
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          cd "chrony-${VERSION}"

          ./configure \
            --prefix=/usr \
            --mandir=/usr/share/man \
            --with-user=_chrony \
            --with-hwclockfile=/etc/adjtime \
            --with-pidfile=/var/run/chronyd.pid \
            --enable-ntp-signd \
            --enable-scfilter

          make -j$(nproc)
          mkdir -p /tmp/chrony-pkg
          make DESTDIR=/tmp/chrony-pkg install

      - name: Create .deb package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          SUFFIX="${{ matrix.pkg_suffix }}"
          PKG_DIR="/tmp/chrony-pkg"
          DEB_DIR="/tmp/chrony-deb"
          ARCH="amd64"

          mkdir -p "${DEB_DIR}/DEBIAN"

          cat > "${DEB_DIR}/DEBIAN/control" <<EOF
          Package: chrony
          Version: ${VERSION}-${SUFFIX}
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libcap2, libnss3, libedit2, libseccomp2
          Conflicts: ntp, time-daemon
          Replaces: ntp, time-daemon
          Provides: time-daemon
          Maintainer: GitHub Actions <github-actions@localhost>
          Description: Versatile NTP client and server
           Chrony is a pair of programs (chronyd and chronyc) for maintaining
           computer clock accuracy. Built from upstream tarball for ${SUFFIX}.
          EOF

          mkdir -p "${DEB_DIR}/usr"
          cp -a "${PKG_DIR}/usr/." "${DEB_DIR}/usr/" 2>/dev/null || true
          cp -a "${PKG_DIR}/etc/." "${DEB_DIR}/etc/" 2>/dev/null || true
          cp -a "${PKG_DIR}/var/." "${DEB_DIR}/var/" 2>/dev/null || true

          mkdir -p "${DEB_DIR}/usr/sbin" "${DEB_DIR}/usr/bin"
          [ -f "${PKG_DIR}/usr/sbin/chronyd" ] && cp -a "${PKG_DIR}/usr/sbin/chronyd" "${DEB_DIR}/usr/sbin/"
          [ -f "${PKG_DIR}/usr/bin/chronyc" ] && cp -a "${PKG_DIR}/usr/bin/chronyc" "${DEB_DIR}/usr/bin/"

          if [ ! -f "${DEB_DIR}/lib/systemd/system/chrony.service" ] && [ ! -f "${DEB_DIR}/lib/systemd/system/chronyd.service" ]; then
            mkdir -p "${DEB_DIR}/lib/systemd/system"
            cat > "${DEB_DIR}/lib/systemd/system/chrony.service" <<'EOF'
          [Unit]
          Description=chrony, an NTP client/server
          After=network.target
          Wants=time-set.target
          Before=time-set.target
          ConditionCapability=CAP_SYS_TIME

          [Service]
          Type=forking
          PIDFile=/var/run/chronyd.pid
          EnvironmentFile=-/etc/default/chrony
          ExecStart=/usr/sbin/chronyd $DAEMON_OPTS
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
          fi

          dpkg-deb --root-owner-group --build "${DEB_DIR}" \
            "/tmp/chrony_${VERSION}-${SUFFIX}_${ARCH}.deb"

          dpkg-deb -I "/tmp/chrony_${VERSION}-${SUFFIX}_${ARCH}.deb"
          dpkg-deb -c "/tmp/chrony_${VERSION}-${SUFFIX}_${ARCH}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrony-${{ needs.check-version.outputs.version }}-${{ matrix.pkg_suffix }}-amd64
          path: /tmp/chrony_${{ needs.check-version.outputs.version }}-${{ matrix.pkg_suffix }}_amd64.deb
          retention-days: 90

  release:
    needs: [check-version, build-deb]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: chrony-${{ needs.check-version.outputs.version }}-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: "Chrony ${{ needs.check-version.outputs.version }}"
          body: |
            Automated build of Chrony ${{ needs.check-version.outputs.version }} for Ubuntu.

            | File | Target |
            |------|--------|
            | `chrony_${{ needs.check-version.outputs.version }}-ubuntu22.04_amd64.deb` | Ubuntu 22.04 (Jammy) |
            | `chrony_${{ needs.check-version.outputs.version }}-ubuntu26.04_amd64.deb` | Ubuntu 26.04 |

            **Firewalla note:** The Ubuntu 22.04 package should also work on 26.04 due to glibc backward compatibility. Install with:
            ```bash
            sudo dpkg -i chrony_*.deb
            # or
            sudo apt install ./chrony_*.deb
            ```
          files: ./artifacts/*.deb
          fail_on_unmatched_files: true
